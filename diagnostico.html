<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diagnóstico del inventario</title><style>body{font:16px system-ui;max-width:800px;margin:30px auto;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a,button{display:inline-block;padding:12px}</style><h1>Diagnóstico del inventario</h1><p>Comprobaciones técnicas de este navegador. No modifica ni elimina registros.</p><button id="check">Actualizar comprobaciones</button><pre id="result" role="status"></pre><a href="index.html">Volver</a><a href="auditoria.html">Auditoría</a><script>
async function check(){const result={pantalla:innerWidth+' × '+innerHeight,conexion:navigator.onLine?'En línea':'Sin conexión',contextoSeguro:isSecureContext,serviceWorker:'serviceWorker'in navigator,registros:0,caches:[],almacenamiento:false,productos:0,movimientos:0};try{result.registros=(await navigator.serviceWorker.getRegistrations()).filter(r=>r.scope===new URL('./',location).href).length;result.caches=(await caches.keys()).filter(k=>k.startsWith('inventario-'));}catch{}try{result.almacenamiento=!!localStorage;const data=JSON.parse(localStorage.getItem('inv_data_v1')||'{}');result.productos=data.p?.length||0;result.movimientos=data.m?.length||0;}catch{}document.getElementById('result').textContent=JSON.stringify(result,null,2);}document.getElementById('check').addEventListener('click',check);check();</script></html>
